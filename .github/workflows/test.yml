name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests
        run: |
          jq -e . .claude-plugin/marketplace.json > /dev/null
          for f in plugins/*/.claude-plugin/plugin.json; do jq -e . "$f" > /dev/null; done
      - name: destructive-guard tests
        run: node --test 'plugins/destructive-guard/test/*.test.mjs'
      - name: gated-dev-simple-workflow tests
        run: node --test 'plugins/gated-dev-simple-workflow/test/*.test.mjs'

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14", ">=3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.9 (for the entry-stub tests)
        run: |
          uv python install 3.9
          echo "OLD_PYTHON=$(uv python find 3.9)" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run python -V
      - run: uv run ruff check .
      - run: uv run pytest
