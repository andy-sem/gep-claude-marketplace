name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: catches jev-latest changing while nobody pushes.
    - cron: "17 3 * * *"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          jq -e . .claude-plugin/marketplace.json > /dev/null
          for f in plugins/*/.claude-plugin/plugin.json; do jq -e . "$f" > /dev/null; done

  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14", "3.x"]
    steps:
      - uses: actions/checkout@v4
      # setup-python puts the tested interpreter on PATH as python3 / python3.X,
      # so the tests' interpreter lookup (find_python) sees it on both legs.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.9 (for the entry-stub tests)
        run: |
          uv python install 3.9
          echo "OLD_PYTHON=$(uv python find 3.9)" >> "$GITHUB_ENV"
      # uv run follows .python-version (3.14) unless told otherwise; pin it to
      # the leg's interpreter so the 3.x leg really tests 3.x.
      - name: Pin uv to the leg's Python
        run: echo "UV_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run python -V
      - run: uv run ruff check .
      - run: uv run pytest

  # Lean model of the lean gate (dev-only, see CLAUDE.md). --wfail also fails
  # on `sorry`, which Lean reports as a warning.
  lean:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the model
        working-directory: plugins/destructive-guard/formal
        run: lake build --wfail

  # Tests against the real Jev (marker live_jev). Never pull_request_target:
  # it would hand the secret to fork code. No artifacts: the repo is public.
  jev-live:
    # Secrets never reach PRs from forks; skip those instead of failing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: CI
    concurrency: { group: jev-live, cancel-in-progress: false }
    timeout-minutes: 10
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      LIVE_JEV_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -m live_jev -p no:cacheprovider -rA
