[project]
name = "gep-claude-marketplace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
addopts = ["--import-mode=importlib"]
pythonpath = [".", "plugins/destructive-guard/lib", "plugins/gated-dev-simple-workflow/scripts"]

[tool.ruff]
target-version = "py314"
src = [".", "plugins/destructive-guard/lib", "plugins/gated-dev-simple-workflow/scripts"]

# Entry stubs must parse on Python 3.7 and still check the version themselves.
[tool.ruff.lint.per-file-ignores]
"plugins/destructive-guard/lib/{check,gate_main}.py" = ["UP031", "UP036"]
"plugins/gated-dev-simple-workflow/{hooks/notify,scripts/launch,scripts/watch_pr,scripts/flow}.py" = ["UP031", "UP036"]
